name: Feature request
description: Something mcaia should be able to do and cannot
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The README's **Limitations** section lists what is known to be missing and why. If your request is already there, say so and add what you need from it rather than opening a duplicate.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The animation or workflow you are after, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you work around it today
      description: What you do instead, and where that breaks down.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - A new import format
        - A new export format
        - The motion vocabulary — new kinds of move
        - Animation quality
        - The 3D preview
        - The interface
        - The API
        - Somewhere else
    validations:
      required: true
